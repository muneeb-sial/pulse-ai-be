# PostgreSQL Database Connection Strings
spring.datasource.url=jdbc:postgresql://localhost:5432/pulseai-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Pool Config
spring.datasource.hikari.pool-name=MainPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.register-mbeans=true

#Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=5000
server.error.include-stacktrace=ALWAYS
server.error.include-path=ALWAYS
server.error.include-message=ALWAYS
server.error.whitelabel.enabled=false
server.error.include-binding-errors=always
logging.pattern.console=%level - %msg%n

### 📦 Content Negotiation (force JSON if needed)
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.default-content-type=application/json

### 🧪 Jackson (JSON serialization)
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true