global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pulse-ai
    metrics_path: /actuator/prometheus
    static_configs:
      # The app runs on the host, not in Docker, so this is the host
      # gateway rather than localhost (which would be the container).
      - targets: ['host.docker.internal:5000']
