#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# PostgreSQL Database Connection Strings
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/pulseai-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Pool Config
spring.datasource.hikari.pool-name=MainPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.register-mbeans=true

#Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Redis (caching) - container defined in docker-compose.yml, not wired up yet
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.cache.type=redis

# Kafka connection
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=pulse-ai-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=MANUAL

# Logging noise reduction
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN


# Elasticsearch (search) - container defined in docker-compose.yml
spring.elasticsearch.uris=http://localhost:9200
# Keep Spring Data from auto-creating indexes: SearchIndexer owns versioned indexes + aliases
spring.data.elasticsearch.repositories.enabled=false

server.port=5000
server.error.include-stacktrace=ALWAYS
server.error.include-path=ALWAYS
server.error.include-message=ALWAYS
server.error.whitelabel.enabled=false
server.error.include-binding-errors=always
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%5p) %clr(-){faint} %clr(%-30.30logger{29}){cyan} %clr(:){faint} %m%n

### 📦 Content Negotiation (force JSON if needed)
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.default-content-type=application/json

### 🧪 Jackson (JSON serialization)
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true

# JDBC batching (matches the id sequence increment of 50) - needed for bulk seeding
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Data seeder (app.seeder) - runs once on boot when enabled; skipped if admin@seed.local already exists
app.seed.enabled=true
app.seed.random-seed=42

# just here for log not actually needed here
app.seed.admin-emai=admin@seed.local
app.seed.password=Password@123
app.seed.reindex-search=true
app.seed.counts.admins=1
app.seed.counts.staff=3
app.seed.counts.departments=12
app.seed.counts.doctors=50
app.seed.counts.patients=500
app.seed.counts.medicines=300
app.seed.counts.appointments=2000
app.seed.counts.max-histories-per-patient=3
app.seed.counts.prescription-rate=0.7
app.seed.counts.max-items-per-prescription=4
app.seed.counts.notifications-per-user=3
# "notes" fields (patients/appointments/records/prescriptions .notes): 1000+ words each
app.seed.notes.min-words=1000
app.seed.notes.max-words=1400
# other clinical text columns (diagnosis, examination, treatment plan, history description, ...)
app.seed.detail.min-words=120
app.seed.detail.max-words=250
